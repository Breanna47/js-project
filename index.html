
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/8b60ccf18e.js"
      crossorigin="anonymous"
    ></script>
    <script src="movies.js" defer></script>
    <title>Javascript Project</title>
  </head>
  <body>
    <nav>
      <div class="nav__container">
        <div class="logo"><b>Movie Source</b></div>

        <ul class="list">
          <li class="list__item">Comedy</li>
        </ul>
      </div>
    </nav>
    <section id="input">
      <div>
        <button class="input__button" onclick="getMovies()">
          <h2>Search</h2>
        </button>
        <input
          id="search__input"
          type="text"
          onkeydown="handleInputKeyDown(event)"
        />
      </div>
    </section>
    <select id="filter" class="select" onchange="filterMovies(event)">
      <option value="" disabled selected>Sort</option>
      <option value="YEAR">Newest to Oldest</option>
            <option value="OLDYEAR">Oldest to Newest</option>

    </select>
    <div id="movie-list"></div>


    <div class="movies movies__loading">
      <i class="fas fa-spinner movies__loading--spinner"></i>
    </div>

    <footer id="footer">
      <div class="footer__logo"><b>Movie Source</b></div>
      <p class="copyright">Copyright © Breanna Watson</p>
    </footer>
  </body>
</html>
